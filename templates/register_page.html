<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='register_page.css') }}">
</head>
<body>
    <img src="{{ url_for('static', filename='src/right_sq.png') }}" id="decor">
    <div class="form-container">
        <form id="auth-form" action="/login" method="post">
            <input type="text" id="username" placeholder="Логин:" required autocomplete="off">
            <input type="password" id="password" placeholder="Пароль:" required autocomplete="off">
            <div class="buttons">
                <button type="button" id="login-btn" onclick="setLoginAction(event)">Войти</button>
                <button type="button" id="register-btn" onclick="setRegisterAction(event)">Зарегистрироваться</button>
            </div>
        </form>
    </div>
    <script>
        function setLoginAction() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const data = {
                username: username,
                password: password
            };

            fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'  // Устанавливаем тип контента как JSON
                },
                body: JSON.stringify(data)  // Преобразуем объект в JSON строку
            })
            .then(response => response.json())  // Обработка ответа сервера (если сервер отправляет JSON)
            .then(data => {
                console.log('Success:', data);
                // Здесь можно обработать успешный ответ от сервера
            })
            .catch(error => {
                console.error('Error:', error);
                // Обработка ошибки, например, вывод сообщения пользователю
            });
        }

        function setRegisterAction() {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            const data = {
                username: username,
                password: password
            };

            fetch('/register', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'  // Устанавливаем тип контента как JSON
                },
                body: JSON.stringify(data)  // Преобразуем объект в JSON строку
            })
            .then(response => response.json())  // Обработка ответа сервера (если сервер отправляет JSON)
            .then(data => {
                console.log('Success:', data);
                // Здесь можно обработать успешный ответ от сервера
            })
            .catch(error => {
                console.error('Error:', error);
                // Обработка ошибки
            });
        }
    </script>
</body>
