<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='register_page.css') }}">
</head>
<body>
    <img src="{{ url_for('static', filename='src/right_sq.png') }}" id="decor">
    <div class="form-container">
        <form id="auth-form">
            <input type="text" id="username" placeholder="Логин:" required autocomplete="off">
            <input type="password" id="password" placeholder="Пароль:" required autocomplete="off">
            <div class="buttons">
                <button type="button" id="login-btn" onclick="setLoginAction(event)">Войти</button>
                <button type="button" id="register-btn" onclick="setRegisterAction(event)">Зарегистрироваться</button>
            </div>
        </form>
        <div id="error-message" style="color: red; display: none;"></div>
    </div>
    <script>
        function handleResponse(data) {
            const errorElement = document.getElementById('error-message');

            if(data.redirect) {
                // Выполняем редирект
                window.location.href = data.redirect;
            }
            else if(data.error) {
                // Показываем ошибку
                errorElement.textContent = data.error;
                errorElement.style.display = 'block';
                setTimeout(() => {
                    errorElement.style.display = 'none';
                }, 3000);
            }
        }

        function setLoginAction(event) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            fetch('/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            })
            .then(response => {
                if(response.status === 401) {
                    return response.json().then(data => ({error: data.error}));
                }
                return response.json();
            })
            .then(handleResponse)
            .catch(error => {
                console.error('Error:', error);
            });
        }

        function setRegisterAction(event) {
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            fetch('/register', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username, password})
            })
            .then(response => {
                if(response.status >= 400) {
                    return response.json().then(data => ({error: data.error}));
                }
                return response.json();
            })
            .then(handleResponse)
            .catch(error => {
                console.error('Error:', error);
            });
        }
    </script>
</body>
</html>
