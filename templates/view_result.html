<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBTI Тест</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='view_result.css') }}">
</head>
<body>
    <header>
        <a href="{{url_for('home')}}">
            <img src="{{ url_for('static', filename='src/top.png') }}" id="top-left-decor">
        </a>
        <nav>
            <ul>
                <li><a href="{{ url_for('info') }}" class="text-button">о тесте</a></li>
                <li><a href="{{ url_for('description') }}" class="text-button">типы личности</a></li>
                <li class="uniform-button">
                {% if current_user.is_authenticated %}
                    <a href="{{ url_for('show_profile') }}">Профиль</a>
                {% else %}
                    <a href="{{ url_for('register') }}">Войти</a>
                {% endif %}
            </li>
            </ul>
        </nav>
    </header>
    <div id="result_div">
        <p class="text">Ваш тип личности</p>
        <h2 id="result">{{ result }}</h2>
        <div id="chart">
            {{ graph_html | safe }}
        </div>
    </div>
    <div id="first-block">
        <img src="{{ url_for('static', filename='src/right_rect.png') }}" id="right-decorator">
        <div class="minor-paragraph">
            <p id="FirstParagraph"></p>
        </div>
    </div>
</body>
<script>
    // Функция для изменения цвета текста в зависимости от его значения
    function changeTextColor(text) {
        const textColors = {
            'ENFJ': '#D58EAC',
            'ENFP': '#E395A3',
            'INFJ': '#FAB6B2',
            'INFP': '#FBD6D9',
            'ISFP': '#F9F2DC',
            'ESFP': '#FEF0B1',
            'ESTP': '#FEDE95',
            'ISTP': '#D0E6A6',
            'ENTJ': '#46C0C1',
            'ENTP': '#89D8E3',
            'INTJ': '#AED2E0',
            'INTP': '#96C3D8',
            'ISFJ': '#56A5BA',
            'ESFJ': '#3592A3',
            'ISTJ': '#B697C2',
            'ESTJ': '#B19CC5'
        };

        // Получаем элемент с текстом
        const textElement = document.getElementById('result');

        // Если текст соответствует ключу, меняем его цвет
        if (textColors[text]) {
            textElement.style.color = textColors[text];
        } else {
            textElement.style.color = 'black';  // Цвет по умолчанию, если текст не найден
        }
    }

    const FirstParagraphTexts = {
      'ISTJ': "Вы – человек, который ценит порядок, стабильность и традиции. Вы практичны, организованы и дисциплинированы. Ваши решения часто основаны на логике и фактах. Вы внимательны к деталям и всегда выполняете свои обязанности с высокой ответственностью.<br><b>Отношения</>b>: Вы — надежный и предсказуемый партнер. Для вас важна стабильность и последовательность в отношениях. Вы не склонны к неожиданным поступкам, и партнер может всегда на вас рассчитывать. Иногда вам трудно проявлять эмоции, но это не означает, что вы не цените вашего партнера — вы показываете свою заботу через действия и ответственность.<br><b>Работа</>b>: На работе вы предпочитаете следовать проверенным методам и всегда выполняете задачи точно и в срок. Вы организованы и педантичны. Ваши коллеги знают, что могут положиться на вас, а ваши навыки делают вас ценным членом команды. Если у вас есть план, вы будете идти по нему без отклонений, не ожидая сюрпризов.<br><b>Личностное развитие</>b>: Для вас важно развиваться через практическое освоение навыков и постоянное улучшение эффективности. Вы стремитесь к совершенствованию в своей профессиональной жизни и обычно предпочитаете следовать уже установленным маршрутам, чем рисковать новым и неизведанным.",
      'ISFJ': "Вы заботитесь о других, стремитесь к гармонии и стабильности в своей жизни. Вы готовы поддержать людей вокруг, иногда даже ставя их интересы выше своих собственных. Ваши действия часто продиктованы вашим желанием помогать и делать мир лучше, при этом вы опираетесь на прошлый опыт и традиции.<br><b>Отношения</b>: Вы — верный и заботливый партнер, который ставит интересы других выше своих. В отношениях вы проявляете внимание к мелочам, и ваши близкие всегда ощущают вашу поддержку. Иногда вы можете быть склонны подавлять свои собственные потребности ради гармонии в отношениях, но ваш партнер чувствует вашу искреннюю заботу и привязанность.<br><b>Работа</b>: Вы — безукоризненный работник. Вам нравится порядок, и вы стремитесь обеспечить стабильность и поддержку окружающим. Иногда вы можете брать на себя слишком много, потому что хотите сделать все идеально, но вы справляетесь с этим, потому что верите в важность своей роли.<br><b>Личностное развитие</b>: Вы предпочитаете развиваться через помощь другим и чувствуете удовлетворение, когда видите, как ваш труд влияет на жизнь других. Важным для вас является создание эмоциональной безопасности в вашем окружении, и вы гордитесь тем, что предоставляете людям стабильную основу.",
      'INFJ': "Вы – глубоко интуитивный и идеалистичный человек, стремящийся изменить мир к лучшему. Ваши сильные моральные принципы направляют вас в жизни, и вы активно стремитесь помочь другим. Вы способны понять людей на глубоком уровне, и часто действуете на основе своих ценностей и убеждений.<br><b>Отношения</b>: Вы очень глубоки в отношениях. Для вас важно, чтобы ваш партнер не только разделял ваши взгляды, но и мог поддерживать ваши ценности и идеалы. Вы склонны к сильной эмоциональной привязанности и, когда найдете 'своего' человека, будете готовы вложиться в отношения на полную. Иногда вы слишком ожидаете от других того, что можете сами дать.<br><b>Работа</b>: В профессиональной сфере вы предпочитаете работать в проектах, которые связаны с помощью другим людям или улучшением общества. Вы не ищете просто стабильности, вы хотите ощущать, что ваша работа имеет смысл и что вы делаете мир лучше. Иногда ваши идеалы могут казаться слишком высокими для окружающих, но вы верите, что правильный путь всегда будет вознагражден.<br><b>Личностное развитие</b>: Для вас развитие — это не просто достижение целей, а создание глубокой связи с собой и другими людьми. Важно быть в гармонии с собой, и вы часто стремитесь к саморазвитию через медитацию, искусство или просто уединение для размышлений.",
      'INTJ': "Вы – стратег, который всегда анализирует ситуацию и ищет наилучшие долгосрочные решения. Вы логичны, независимы и предпочитаете работать над чем-то важным и значимым. Ваша способность планировать и предсказывать будущее помогает вам достигать успеха и расти.<br><b>Отношения</b>: Вы предпочитаете интеллектуальную близость в отношениях и цените партнера, который не только разделяет ваши интересы, но и может стимулировать вас на более высокие достижения. В отношениях вы стремитесь к партнёрству на равных, где оба развиваются и поддерживают амбиции друг друга. Бывает, что вы слишком погружены в свои идеи и можете забывать о потребностях партнера в эмоциональной близости.<br><b>Работа</b>: Вы — стратег и мыслитель, и вам не интересуют задачи, не имеющие долгосрочной перспективы. В профессиональной сфере вы строите свои планы с прицелом на будущее, всегда ищете оптимальные решения и не боитесь идти против течения. Вы требовательны к себе и к другим, потому что всегда хотите достичь максимальных результатов.<br><b>Личностное развитие</b>: Для вас развитие — это постоянное движение к новым вершинам. Вам важно достигать высоких целей, и вы видите мир как пространство возможностей для самореализации. Вы хотите знать, что ваш вклад в этот мир будет иметь долгосрочные и значимые последствия.<br><br>",
      'ISTP': "Вы – практичный и логичный человек, который предпочитает действовать в моменты, когда это необходимо. Вам нравится решать проблемы и работать руками, используя свои технические навыки. Вы цените независимость и часто проявляете умение адаптироваться к любой ситуации.<br><b>Отношения</b>: В отношениях вы предпочитаете свободу и независимость. Вам не нравятся ограничения, и вам важно, чтобы ваш партнер уважал ваше пространство. Вы склонны показывать свою привязанность через действия, а не слова. Если кто-то рядом с вами — это значит, что он прошел испытание временем и понимает вашу личность.<br><b>Работа</b>: В профессиональной сфере вы человек действия, и вам нравится решать проблемы на ходу. Вы легко адаптируетесь к неожиданным ситуациям и всегда готовы найти быстрые и практичные решения. Вы не любите рутину и предпочитаете работать в условиях, которые требуют от вас гибкости и быстрого принятия решений.<br><b>Личностное развитие</b>: Вы цените личную свободу и независимость, и ваше развитие связано с умением работать в нестандартных ситуациях. Вам важно быть уверенным в своих силах и навыках, и вы постоянно ищете новые способы улучшить свою практическую компетентность.<br><br>",
      'ISFP': "Вы – человек, который чувствует мир и жизнь через свои чувства и восприятие. Вы творческий и гармоничный, часто предпочитаете уникальные и нетрадиционные способы выражения себя. Вам важно ощущение свободы и возможность делать то, что приносит радость.<br><b>Отношения</b>: Вы чувственный и заботливый партнер, который выражает свою любовь через действия и внимание к мелочам. Вы можете быть скрытным в своих чувствах, но когда вы открываетесь, это настоящая искренняя привязанность. Вам важно, чтобы ваш партнер ценил вашу индивидуальность и не пытался вас контролировать.<br><b>Работа</b>: В работе вам важен творческий подход и возможность выражать свою индивидуальность. Вы не любите следовать строгим правилам и предпочитаете искать свои пути для решения задач. В вашем подходе всегда есть элемент художественного взгляда на мир, и это делает вас уникальным в профессиональной сфере.<br><b>Личностное развитие</b>: Ваше развитие связано с поиском гармонии и самовыражением. Вам важно чувствовать, что вы можете быть собой и при этом приносить что-то уникальное миру. Вы стремитесь к внутреннему балансу и часто находите вдохновение в искусстве или природе.",
      'INFP': "Вы – мечтатель, который верит в идеалы и глубокие ценности. Вы ищете смысл в жизни и стремитесь быть верными своим убеждениям. Ваша способность понимать эмоции других людей помогает вам находить общие точки соприкосновения и быть хорошим другом.<br><b>Отношения</b>: Вы — идеалист в отношениях, и вам важно найти партнера, который будет понимать вас и поддерживать ваши ценности. Вы эмоциональны и глубоко привязаны к своему партнеру, готовые делать все ради него. Однако, из-за своей чувствительности, вы можете переживать из-за малейших недоразумений.<br><b>Работа</b>: В профессиональной сфере вы ищете смысл в том, чем занимаетесь. Для вас важно, чтобы ваша работа была связана с вашими личными убеждениями. Вы креативны и часто создаете проекты, которые направлены на позитивные изменения в мире. Однако вам бывает сложно адаптироваться к строгим структурам или бюрократии.<br><b>Личностное развитие</b>: Ваше развитие связано с поиском гармонии и глубины. Вы стремитесь к саморазвитию через выражение своих идеалов и ценностей, что делает вашу жизнь насыщенной и значимой.",
      'INTP': "Вы – рациональный и аналитичный человек, который стремится разобраться в любой проблеме и найти оптимальные решения. Ваши идеи и теории часто идут за пределы привычных представлений, и вам нравится глубоко исследовать мир и выстраивать логические связи.<br><b>Отношения</b>: В отношениях вы — глубокий мыслитель, и вам важна интеллектуальная совместимость с партнером. Вы цените независимость и личное пространство, но готовы открыться и быть искренним с тем, кто сможет понять ваши идеи и мысли.<br><b>Работа</b>: В работе вы стремитесь к разгадыванию сложных проблем и созданию теоретических моделей. Вы часто углубляетесь в детали и избегаете скучной рутинной работы. Ваши аналитические способности и способность к абстракции делают вас ценным специалистом в области исследований и разработки.<br><b>Личностное развитие</b>: Вы развиваетесь через расширение своего кругозора и освоение новых теорий. Вам важно осмысленно и глубоко понять мир, что заставляет вас искать ответы на сложные вопросы и принимать нестандартные решения.",
      'ESTP': "Вы активны, энергичны и любите действовать здесь и сейчас. Вам нравится быть в центре событий, испытывать новые ощущения и решать проблемы на ходу. Вы быстро принимаете решения и не боитесь рисковать, что делает вас отличным лидером в нестандартных ситуациях.<br><b>Отношения</b>: Вы — активный и энергичный партнер. В отношениях вам важна динамика и спонтанность. Вы предпочитаете решать проблемы на ходу, и вам нравится, когда все идет легко и без лишней драматизации. Вы часто проявляете свою заботу через действия, а не слова, и умеете создавать захватывающие моменты для вашего партнера. Иногда вам сложно быть терпеливым в отношениях, когда что-то идет не по плану.<br><b>Работа</b>: В профессиональной сфере вы предпочитаете действовать быстро и эффективно. Вам нравится работать в условиях, где важна оперативность, и вы способны принимать решения на ходу, без долгих размышлений. Вы любите решать проблемы и всегда готовы к новым вызовам. Ваши способности к решению конкретных задач делают вас отличным лидером или экспертом в нестандартных ситуациях.<br><b>Личностное развитие</b>: Вы развиваетесь через опыт и практическое применение знаний. Для вас важно, чтобы жизнь была насыщенной и активной. Вы стремитесь развиваться через пробу и ошибку, а не через теоретические размышления. Любите новые впечатления и готовы пробовать все новое.",
